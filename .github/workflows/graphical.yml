name: Dedicated graphical validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-graphical-${{ github.repository }}
  cancel-in-progress: false
jobs:
  graphical:
    runs-on: [self-hosted, Windows, X64, godot-gui]
    timeout-minutes: 20
    env:
      GODOT_BIN: ${{ vars.GODOT_BIN }}
      GODOT_VISUAL_INTEGRATION: '1'
      GODOT_RUNTIME_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration:visual
      - run: npm run test:integration:runtime
      - name: Copy graphical evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphical-evidence
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .godot-mcp/visual-test-runs/**
            .godot-mcp/runtime-test-runs/**
            !.godot-mcp/**/.godot-mcp/runtime/**
            !.godot-mcp/**/.godot-mcp/config.json
