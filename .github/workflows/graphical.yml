name: Dedicated graphical validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-graphical-${{ github.repository }}
  cancel-in-progress: false
jobs:
  graphical:
    runs-on: [self-hosted, Windows, X64, godot-gui]
    timeout-minutes: 20
    env:
      GODOT_BIN: ${{ vars.GODOT_BIN }}
      GODOT_VISUAL_INTEGRATION: '1'
      GODOT_RUNTIME_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          clean: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration:visual
      - run: npm run test:integration:runtime
      - name: Copy graphical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graphical-evidence
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .godot-mcp/visual-test-runs/**
            .godot-mcp/runtime-test-runs/**
            !.godot-mcp/**/.godot-mcp/runtime/**
            !.godot-mcp/**/.godot-mcp/config.json
