name: Windows validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.node == '22' && 'windows-2022' || 'windows-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      REQUIRE_GODOT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:docs
      - name: Install verified Godot
        shell: pwsh
        run: ./scripts/ci-install-godot.ps1 -Destination "$env:RUNNER_TEMP/godot-mcp-engine"
      - run: npm run check:godot
      - run: npm run test:integration
      - name: Enable native crash dumps for graphical fixtures
        if: matrix.node == '22'
        shell: pwsh
        run: |
          $dumpDirectory = (New-Item -ItemType Directory -Force -Path '.godot-mcp/native-crash-test-runs').FullName
          $engineName = Split-Path -Leaf $env:GODOT_BIN
          $dumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$engineName"
          New-Item -Path $dumpKey -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpFolder -Value $dumpDirectory -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpCount -Value 4 -PropertyType DWord -Force | Out-Null
          'GODOT_TEST_NATIVE_CRASH_DIAGNOSTICS=1' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify running-game capture and runtime behavior
        if: matrix.node == '22'
        env:
          GODOT_RUNTIME_INTEGRATION: '1'
        run: npm run test:integration:runtime
      - name: Verify graphical editor capture
        if: matrix.node == '22'
        env:
          GODOT_VISUAL_INTEGRATION: '1'
        run: npm run test:integration:visual
      - run: npm run test:distribution
      - name: Retain native crash diagnostics
        if: failure()
        shell: pwsh
        run: |
          $evidenceDirectory = '.godot-mcp/native-crash-test-runs'
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          try {
            $events = @(Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddMinutes(-40)} -ErrorAction Stop |
              Where-Object { $_.Message -match 'Godot' } |
              Select-Object TimeCreated, Id, ProviderName, Message)
            ConvertTo-Json -InputObject $events -Depth 3 | Set-Content -Path "$evidenceDirectory/events.json"
            $events | ForEach-Object { Write-Output $_.Message }
          } catch {
            @{diagnosticError=$_.Exception.Message} | ConvertTo-Json | Set-Content -Path "$evidenceDirectory/events.json"
            Write-Output "Native crash events unavailable: $($_.Exception.Message)"
          }
          node tests/integration/helpers/summarize_minidumps.mjs $evidenceDirectory
      - name: Retain test and package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-node-${{ matrix.node }}
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .godot-mcp/distribution/**
            .godot-mcp/*-test-runs/**
            !.godot-mcp/**/.godot-mcp/runtime/**
            !.godot-mcp/**/.godot-mcp/config.json
            !.godot-mcp/**/node_modules/**
